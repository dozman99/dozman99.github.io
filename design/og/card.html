<!doctype html>
<!-- Link-preview cards (1200 x 630). Rendered to public/og/*.jpg by
     design/og/render.sh with headless Chrome. ?kind=home or
     ?kind=project&slug=..&title=..&where=..&depth=.. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Switzer; src: url("../../public/fonts/Switzer-Variable.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; font-family: Switzer, sans-serif; color: #fff; }
  .mark { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #0a0a0a; font-weight: 700; font-size: 19px; letter-spacing: -0.5px; }
  .name { font-weight: 600; letter-spacing: -0.045em; line-height: 0.92; }
  .muted { color: rgba(255, 255, 255, 0.72); }
  .faint { color: rgba(255, 255, 255, 0.55); }

  /* Home: portrait on the left, role and intro on black. The name is the
     chat text under the image, so it isn't repeated here. */
  .home { display: grid; grid-template-columns: 473px 1fr; height: 630px; }
  .home img { width: 473px; height: 630px; object-fit: cover; object-position: top; display: block; }
  .home .panel { display: flex; flex-direction: column; justify-content: center; padding: 56px 64px; }
  .home .role { font-size: 80px; }
  .home .line { font-size: 28px; line-height: 1.35; margin-top: 32px; max-width: 600px; }

  /* Project: its photo full bleed, a dark fade from the left, text on it. */
  .project { position: relative; height: 630px; }
  .project img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .project .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,.92) 0%, rgba(10,10,10,.78) 45%, rgba(10,10,10,.25) 100%); }
  .project .panel { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 64px; max-width: 860px; }
  .project .where { font-size: 22px; }
  .project .title { font-size: 76px; margin-top: 18px; text-wrap: balance; }
  .project .depth { font-size: 26px; margin-top: 22px; }
  .project .by { display: flex; align-items: center; gap: 16px; font-size: 22px; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
  if (q.get("kind") === "project") {
    document.body.innerHTML = `
      <div class="project">
        <img src="../../public/work/${esc(q.get("slug"))}-wide-1400.webp" alt="" />
        <div class="fade"></div>
        <div class="panel">
          <div>
            <p class="where muted">(${esc(q.get("where"))})</p>
            <h1 class="title name">${esc(q.get("title"))}</h1>
            <p class="depth muted">${esc(q.get("depth"))}</p>
          </div>
          <div class="by"><span class="mark">CO</span><span>Chiedozie Onyekwum <span class="faint">· DevOps / MLOps Engineer</span></span></div>
        </div>
      </div>`
  } else {
    document.body.innerHTML = `
      <div class="home">
        <img src="../../public/portrait.webp" alt="" />
        <div class="panel">
          <h1 class="role name">${esc(q.get("role"))}</h1>
          <p class="line muted">${esc(q.get("line"))}</p>
        </div>
      </div>`
  }
</script>
</body>
</html>
