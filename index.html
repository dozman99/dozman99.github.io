<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CO monogram, white on black. SVG for modern tabs, .ico for older
         browsers, apple-touch-icon for iOS home screens and link previews,
         and the manifest for Chrome shortcuts, the taskbar and Android. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Chiedozie Onyekwum · DevOps / MLOps Engineer</title>
    <meta
      name="description"
      content="I own systems end to end: built secure, run reliably, shipped fast."
    />
    <!-- Link previews (LinkedIn, Slack, X). Title, description and URL are
         rewritten per route by scripts/prerender.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chiedozie Onyekwum" />
    <meta property="og:title" content="Chiedozie Onyekwum · DevOps / MLOps Engineer" />
    <meta property="og:description" content="I own systems end to end: built secure, run reliably, shipped fast." />
    <meta property="og:url" content="https://dozman99.github.io/" />
    <meta property="og:image" content="https://dozman99.github.io/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chiedozie Onyekwum, DevOps / MLOps Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chiedozie Onyekwum · DevOps / MLOps Engineer" />
    <meta name="twitter:description" content="I own systems end to end: built secure, run reliably, shipped fast." />
    <meta name="twitter:image" content="https://dozman99.github.io/og/home.jpg" />
    <script>
      // Applied before paint to avoid a flash of the wrong theme. Light is the
      // default; the theme toggle can store "dark" or "system" instead.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          t === 'dark'
            ? true
            : t === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : false
        if (dark) {
          document.documentElement.classList.add('dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#16171b')
        }
      })()
    </script>
    <script>
      // Start animated headings and photos hidden so they don't flash before
      // animating in. If the motion code hasn't arrived in 4 s, show them.
      ;(function (root) {
        var motion = window.matchMedia('(prefers-reduced-motion: no-preference)')
        // Follow the setting if it changes mid-visit, so nothing is left hidden.
        motion.addEventListener('change', function (e) {
          root.classList.toggle('motion', e.matches)
        })
        if (!motion.matches) return
        root.classList.add('motion')
        setTimeout(function () {
          if (!window.__motionReady) root.classList.remove('motion')
        }, 4000)
      })(document.documentElement)
    </script>
    <script>
      // Unpacks the redirect from 404.html (see that file for why) before
      // react-router mounts, so a shared deep link resolves to the right page.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
